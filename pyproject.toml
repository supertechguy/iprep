[project]
name = "iprep"
version = "0.1.0"
description = "CLI tool aggregating IP reputation and enrichment across 20+ free and paid threat-intel sources."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "rich>=13.7",
    "dnspython>=2.6",
]

[project.scripts]
iprep = "iprep.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
